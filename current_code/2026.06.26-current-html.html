<canvas width="600" id="myChart" height="400">&nbsp;</canvas>
<div width="800" style="text-align: center" class="radio-group">
  <strong style="margin-right: 10px">Flight:</strong>
  <label>
    <input
      value="currentflight"
      type="radio"
      name="flightToggle"
      checked="checked"
    />
    Current Flights
  </label>
  <label>
    <input value="additionalflight" type="radio" name="flightToggle" />
    Additional Long-Haul Flight
  </label>
  <label>
    <input value="noflight" type="radio" name="flightToggle" /> No Flights
  </label>
</div>

<div style="text-align: center" class="radio-group">
  <strong style="margin-right: 10px">Heating:</strong>
  <label>
    <input value="naturalgas" type="radio" name="heatingToggle" /> Natural Gas
  </label>
  <label>
    <input value="electric" type="radio" name="heatingToggle" /> Electric
  </label>
  <label>
    <input value="heatpump" type="radio" name="heatingToggle" /> Heat Pump
  </label>
  <label>
    <input value="oilpropane" type="radio" name="heatingToggle" /> Oil/Propane
  </label>
  <label> <input value="wood" type="radio" name="heatingToggle" /> Wood </label>
</div>

<div style="text-align: center" class="radio-group">
  <strong style="margin-right: 10px">Vehicle:</strong>
  <label>
    <input value="petrol" type="radio" name="vehicleToggle" /> Gas
  </label>
  <label>
    <input value="hybrid" type="radio" name="vehicleToggle" /> Hybrid
  </label>
  <label>
    <input value="battery" type="radio" name="vehicleToggle" /> Electric
  </label>
  <label>
    <input value="phev" type="radio" name="vehicleToggle" /> Plug-in hybrid
  </label>
  <label>
    <input value="novehicle" type="radio" name="vehicleToggle" /> No Vehicle
  </label>
</div>

<div style="text-align: center" class="radio-group">
  <strong style="margin-right: 10px">Diet:</strong>
  <label>
    <input value="omnivore" type="radio" name="dietToggle" /> Omnivore
  </label>
  <label>
    <input value="flexitarian" type="radio" name="dietToggle" /> Flexitarian
  </label>
  <label>
    <input value="vegetarian" type="radio" name="dietToggle" /> Vegetarian
  </label>
  <label> <input value="vegan" type="radio" name="dietToggle" /> Vegan </label>
</div>
